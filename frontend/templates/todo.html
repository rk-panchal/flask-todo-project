<!DOCTYPE html>
<html lang="en">
<head>
    <title>Todo Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        label {
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Todo Form</h1>

    <form action="/submittodoitem" method="POST">

        <label>Item Name</label>
        <input type="text"
               name="itemName"
               placeholder="Enter item name"
               required>

        <label>Item Description</label>
        <textarea name="itemDescription"
                  placeholder="Enter item description"
                  required></textarea>

        <button type="submit">Submit</button>

    </form>
</div>

</body>
</html>
